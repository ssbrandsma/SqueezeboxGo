# spotify backend — Spotify Connect via librespot v0.8.0 (WP3).
# Supervised via base/service.sh; audio via base/audio-owner-client.sh
# acquire|release spotify (claim binds the librespot pid, held for the whole
# backend lifetime — NOT per track); Now Playing via the --onevent hook
# (integration/spotify-onevent.sh, schema v1); web routes via
# integration/web-routes.sh. Config: spotify.conf in this directory.
# $BASE_DIR and $plugindir are set by base/adapter.sh (it sources this file).
BACKEND_CMD="$BASE_DIR/../integration/spotify-run.sh $plugindir"
