# spotify.conf — Spotify Connect (librespot) service configuration.
#
# Every key below is a REAL librespot v0.8.0 option, named exactly as the
# binary reads it from the environment: `LIBRESPOT_<LONG-OPTION>` with `-`
# spelled `_` (src/main.rs `stripped_env_key`). CLI flags take precedence
# over these variables; the wrapper (integration/spotify-run.sh) pins only
# the integration-critical flags (--backend/--device/--mixer/--onevent/
# --emit-sink-events) and lets the rest flow through the environment.
#
# Format: POSIX shell assignments, one per line; `KEY=value`, no `export`
# needed (the wrapper sources this file with `set -a`). Comment lines start
# with `#`. Unknown keys are IGNORED by librespot (it only reads names it
# defines), so typos fail silently upstream — the wrapper pre-validates the
# marked [*] keys and exits 2 on bad values before the binary starts.
#
# Target path: /etc/squeezebox/standalone/services/spotify/spotify.conf
# (next to backend.conf; see standalone/systemd/README.md install layout).
# NEVER commit credentials to this file in git: the shipped defaults carry
# no username/password/token. Spotify Connect discovery needs NO credentials
# at all — control comes from a phone/desktop Spotify client; a Spotify
# Premium account is required on the *controlling* side only (Spotify's
# rule, not ours). Credentials below exist for headless auto-login only.
#
# --- device identity ---
# Device name shown in Spotify clients. Default: Librespot. Empty rejected.
LIBRESPOT_NAME="Squeezebox"
# Displayed device type. Default: speaker. Valid: computer, tablet,
# smartphone, speaker, tv, avr, stb, audiodongle, gameconsole, castaudio,
# castvideo, automobile, smartwatch, chromebook, carthing.
#LIBRESPOT_DEVICE_TYPE="speaker"

# --- audio path [* validated] ---
# Audio backend. Default: alsa (first compiled backend is the default, and
# our build compiles alsa+pipe+subprocess). The wrapper REQUIRES alsa unless
# SPOTIFY_ALLOW_NON_ALSA=1 is exported: only the ALSA backend holds the
# device the audio-owner claim refers to.
#LIBRESPOT_BACKEND="alsa"
# ALSA device, e.g. hw:0,0. Unset = backend default. Empty rejected.
# Use `librespot --device '?' --backend alsa` on the target to list.
#LIBRESPOT_DEVICE=""
# Mixer. Default: softvol. Valid: softvol, alsa. The alsa mixer drives a
# hardware control (see ALSA_MIXER_* below); softvol scales in software.
LIBRESPOT_MIXER="softvol"
# Initial volume in % (0-100). Default: 50 for softvol; current control
# value for the alsa mixer.
#LIBRESPOT_INITIAL_VOLUME="50"
# ALSA mixer control/device/index (alsa mixer only). Defaults: PCM,
# --device value, 0.
#LIBRESPOT_ALSA_MIXER_CONTROL="PCM"
#LIBRESPOT_ALSA_MIXER_DEVICE="hw:0"
#LIBRESPOT_ALSA_MIXER_INDEX="0"
# Output format. Default: S16. Valid: F64, F32, S32, S24, S24_3, S16.
#LIBRESPOT_FORMAT="S16"
# Volume control scale / range / steps. Defaults: log, 60.0 (softvol),
# 64 steps.
#LIBRESPOT_VOLUME_CTRL="log"
#LIBRESPOT_VOLUME_RANGE="60.0"
#LIBRESPOT_VOLUME_STEPS="64"

# --- streaming quality ---
# Bitrate in kbps. Default: 160. Valid: 96, 160, 320 [* validated].
#LIBRESPOT_BITRATE="160"

# --- cache (all optional; a cache that cannot be created only warns) ---
#LIBRESPOT_CACHE="/var/cache/squeezebox/spotify"
#LIBRESPOT_SYSTEM_CACHE="/var/lib/squeezebox/spotify"
#LIBRESPOT_CACHE_SIZE_LIMIT="1G"
#LIBRESPOT_TMP="/tmp"

# --- discovery / network ---
# Zeroconf discovery is ON by default and is the credential-free path.
# Setting DISABLE_DISCOVERY (any value incl. empty... see note) without
# credentials makes librespot exit 1 ("Credentials are required if
# discovery and oauth login are disabled"). NOTE: librespot treats a
# LIBRESPOT_DISABLE_DISCOVERY variable as *present* even when empty, so to
# keep discovery enabled LEAVE THE LINE COMMENTED OUT — do not set it empty.
#LIBRESPOT_DISABLE_DISCOVERY="1"
# Port the internal server advertises over zeroconf (1-65535). Default: 0
# (ephemeral). Ports <= 1024 may require root.
#LIBRESPOT_ZEROCONF_PORT="0"
# Zeroconf backend. Our build compiles libmdns only; avahi/dns-sd are
# known names but NOT compiled — requesting one exits 1.
#LIBRESPOT_ZEROCONF_BACKEND="libmdns"
# Comma-separated interface IPs for zeroconf bind. Default: all interfaces.
#LIBRESPOT_ZEROCONF_INTERFACE=""
# Access-point port / HTTP proxy for restricted networks.
#LIBRESPOT_AP_PORT="443"
#LIBRESPOT_PROXY=""

# --- credentials (headless auto-login ONLY; normally leave all unset) ---
# With discovery enabled and no credentials, librespot idles and waits for
# a Spotify client to take over — this is the normal appliance mode.
#LIBRESPOT_USERNAME=""
#LIBRESPOT_PASSWORD=""
#LIBRESPOT_ACCESS_TOKEN=""
# Interactive OAuth sign-in (needs a browser on first run; port 1-65535).
#LIBRESPOT_ENABLE_OAUTH=""
#LIBRESPOT_OAUTH_PORT=""

# --- playback behaviour ---
# Gapless, normalisation, dither, autoplay: passthrough to the real flags.
# See `librespot --help` for the full accepted sets.
#LIBRESPOT_DISABLE_GAPLESS=""
#LIBRESPOT_ENABLE_VOLUME_NORMALISATION=""
#LIBRESPOT_NORMALISATION_METHOD="dynamic"
#LIBRESPOT_NORMALISATION_GAIN_TYPE="auto"
#LIBRESPOT_NORMALISATION_PREGAIN="0.0"
#LIBRESPOT_NORMALISATION_THRESHOLD="-2.0"
#LIBRESPOT_NORMALISATION_ATTACK="5"
#LIBRESPOT_NORMALISATION_RELEASE="100"
#LIBRESPOT_NORMALISATION_KNEE="5.0"
#LIBRESPOT_DITHER=""
#LIBRESPOT_AUTOPLAY=""

# --- INTEGRATION-OWNED flags: do NOT set here ---
# LIBRESPOT_ONEVENT and LIBRESPOT_EMIT_SINK_EVENTS are pinned by
# spotify-run.sh to integration/spotify-onevent.sh (+ sink events on).
# They feed Now Playing; explicit wrapper argv would override these anyway
# (CLI beats env), so setting them here has no effect.
