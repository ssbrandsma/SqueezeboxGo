# Linux config fragment for RG35XX H (merged onto arm64 defconfig, then olddefconfig).
# Pinned tree: linux v7.3.4 (see pins.env). arm64 defconfig already covers
# systemd basics (cgroups, devtmpfs, inet, ipv6); this fragment adds the
# H700/RG35XX-H hardware drivers. Options marked MAYBE need hardware proof.

# --- Display (needs OOT SoC+panel DTS; see kernel/patches/oot-patch-list.md) ---
CONFIG_DRM=y
CONFIG_DRM_SUN4I=y
CONFIG_DRM_SUN8I_MIXER=y
CONFIG_DRM_SUN6I_DSI=y
CONFIG_DRM_PANEL_SIMPLE=y
CONFIG_DRM_PANFROST=y
CONFIG_BACKLIGHT_CLASS_DEVICE=y
CONFIG_BACKLIGHT_PWM=y
CONFIG_PWM=y
CONFIG_PWM_SUN4I=y
CONFIG_FB=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_LOGO=y

# --- Input: sticks (adc-joystick), buttons (gpio-keys), power key ---
CONFIG_INPUT_EVDEV=y
CONFIG_INPUT_JOYDEV=y
CONFIG_KEYBOARD_GPIO=y
CONFIG_JOYSTICK_ADC=y
CONFIG_IIO=y
CONFIG_SUN4I_GPADC=y
CONFIG_INPUT_AXP20X_PEK=y

# --- Audio: internal sun50i-codec (LINEOUT->speakers/jack), USB DAC optional ---
CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_SOC=y
CONFIG_SND_SUN8I_CODEC=y
CONFIG_SND_SUN50I_CODEC_ANALOG=y
CONFIG_SND_SUN4I_SPDIF=m
# MAYBE CONFIG_SND_SUN8I_CODEC_ANALOG=y
CONFIG_SND_USB_AUDIO=m
CONFIG_SND_ALOOP=m

# --- Power: AXP717 PMIC, battery, charger ---
CONFIG_MFD_AXP20X_I2C=y
CONFIG_MFD_AXP20X_RSB=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_AXP20X=y
CONFIG_AXP20X_POWER=y
CONFIG_AXP20X_ADC=y
CONFIG_BATTERY_AXP20X=y
CONFIG_CHARGER_AXP20X=y

# --- Wi-Fi + BT: RTL8821CS (SDIO mmc1 + uart1) ---
CONFIG_WLAN=y
CONFIG_RTW88=y
CONFIG_RTW88_SDIO=y
CONFIG_RTW88_8821C=y
CONFIG_RTW88_8821CS=m
CONFIG_BT=y
CONFIG_BT_HCIUART=y
CONFIG_BT_HCIUART_SERDEV=y
CONFIG_BT_HCIUART_3WIRE=y
CONFIG_BT_RTL=y
CONFIG_BT_HCIUART_RTL=y

# --- Storage / USB / misc SoC ---
CONFIG_MMC=y
CONFIG_MMC_SUNXI=y
CONFIG_USB=y
CONFIG_USB_EHCI_HCD=y
CONFIG_USB_OHCI_HCD=y
CONFIG_USB_MUSB_HDRC=y
CONFIG_USB_MUSB_SUNXI=y
CONFIG_NOP_USB_XCEIV=y
CONFIG_PHY_SUN4I_USB=y
CONFIG_RTC_DRV_SUN6I=y
CONFIG_SUN8I_THERMAL=y
CONFIG_NVMEM_SUNXI_SID=y
CONFIG_CPUFREQ_DT=y
CONFIG_SERIAL_8250_DW=y
CONFIG_I2C_MVTWSI=y
CONFIG_SUNXI_WDT=y
CONFIG_LEDS_GPIO=y
CONFIG_LEDS_TRIGGERS=y
CONFIG_LEDS_TRIGGER_HEARTBEAT=y

# --- Filesystems for our GPT layout (FAT boot + ext4 rootfs) ---
CONFIG_EXT4_FS=y
CONFIG_VFAT_FS=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ASCII=y
CONFIG_TMPFS=y
CONFIG_SQUASHFS=m
