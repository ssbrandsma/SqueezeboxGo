# U-Boot common config fragment for RG35XX H (both DRAM variants).
# Appended to .config after the defconfig by build-uboot.sh (then olddefconfig).
# Squeezebox additions on top of upstream anbernic_rg35xx_h700_defconfig.

# `gpio` command for boot.scr: boot.cmd drives the status LED (PI11 = gpio 267)
# as a U-Boot-proper-alive signal. gpiolib + sunxi GPIO already in defconfig.
CONFIG_CMD_GPIO=y
