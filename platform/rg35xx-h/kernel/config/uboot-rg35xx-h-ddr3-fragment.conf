# U-Boot config fragment: RG35XX H DDR3 variant.
# Appended to .config after anbernic_rg35xx_h700_defconfig (which selects
# SUNXI_DRAM_H616_LPDDR4), then olddefconfig. See build-uboot.sh.
#
# WARNING (WP2 hardware gate): the defconfig TPR/DX/ODT values are tuned for
# the LPDDR4 board. The DDR3_1333 timing CLASS is correct for DDR3 units
# (Kconfig: arch/arm/mach-sunxi/Kconfig @ v2026.10), but per-board TPR values
# must be validated against a DDR3 unit (stock boot0 dump / serial boot log)
# before the ddr3 image is declared bootable.

# CONFIG_SUNXI_DRAM_H616_LPDDR4 is not set
CONFIG_SUNXI_DRAM_H616_DDR3_1333=y
