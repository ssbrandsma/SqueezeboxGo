# system.conf — Squeezebox RG35XX H runtime knobs (installed to /etc/squeezebox/).
# Shell-includable. No secrets in this file: Wi-Fi PSK lives in the live
# /etc/wpa_supplicant/wpa_supplicant.conf provisioned from the .template.

# Features
SPLASH_ENABLED=1
WIFI_ENABLED=1

# Network
WIFI_IF=wlan0

# Audio (interface-contracts knobs; empty = driver default)
USEALSA_DEVICE=default
USEALSA_SAMPLE_SIZE=
USEALSA_BUFFER=
USEALSA_PERIOD=
USEALSA_NOMMAP=0
USEALSA_PCM_TIMEOUT=
SQUEEZEPLAY_NOPLAYBACK=0
# UTMAC: unset = derived from wlan0 MAC at launch (see squeezeplay.sh)

# Display/input (honored by Agent 2/4 binaries when present)
SDL_VIDEODRIVER=kmsdrm
SDL_AUDIODRIVER=alsa
