# OpenSSH server drop-in (installed to /etc/ssh/sshd_config.d/10-squeezebox.conf).
# No default passwords anywhere: root is key-only; user provisioning is a WP2
# first-boot story (with Agent 5 web mgmt). Serial console stays available.
PermitRootLogin prohibit-password
PasswordAuthentication no
ChallengeResponseAuthentication no
X11Forwarding no
AllowAgentForwarding no
