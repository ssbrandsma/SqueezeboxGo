# asound.conf template — RG35XX H (WP1)
#
# Install: copy to /etc/asound.conf on the target image (Agent 1 owns the
# image; this file is the audio-owned template). Reload with
# `alsactl kill rescan` or reboot.
#
# Design:
# - `default` resolves to the internal H616 codec ("H616 Audio Codec")
#   and stays valid when no USB DAC is present.
# - USB DACs (snd-usb-audio) are addressed by the `usb` alias, which fails
#   cleanly at *open* time when no DAC is attached (the hotplug signal
#   scripts key on); the config itself always parses.
# - No dmix/dsnoop: the audio-owner arbiter (audio/arbiter/) guarantees a
#   single holder, so software mixing would only add latency and failure
#   modes. `default` is plug-wrapped for format/rate conversion.
# - Card selection is numeric with env overrides, verified against
#   /proc/asound/cards on the target (see audio/alsa/capability-detect.sh).
#   Card-number policy (Agent 1 udev): internal codec pinned to index 0,
#   USB DACs take 1+.
#
# Env knobs (same style as the USEALSA* knobs jive_alsa honors):
#   ALSA_DEFAULT_PCM   PCM `default` points at (default: "internal")
#   ALSA_INTERNAL_CARD card index of the internal codec (default: "0")
#   ALSA_USB_PCM       PCM `usb_or_internal` prefers (default: "internal")
#   ALSA_USB_CARD      card index of the USB DAC (default: "1")

# --- internal codec (default output) -------------------------------------
pcm.internal {
    type plug
    slave {
        pcm {
            type hw
            card {
                @func getenv
                vars [ ALSA_INTERNAL_CARD ]
                default "0"
            }
            device 0
        }
        rate 48000
        format S32_LE
        channels 2
    }
    hint {
        show on
        description "Internal speakers/headphone jack (sun4i-codec LINEOUT)"
    }
}

ctl.internal {
    type hw
    card {
        @func getenv
        vars [ ALSA_INTERNAL_CARD ]
        default "0"
    }
}

# --- USB DAC (optional) ---------------------------------------------------
pcm.usb {
    type plug
    slave {
        pcm {
            type hw
            card {
                @func getenv
                vars [ ALSA_USB_CARD ]
                default "1"
            }
            device 0
        }
        rate 48000
        format S32_LE
        channels 2
    }
    hint {
        show on
        description "USB DAC (snd-usb-audio card, if present)"
    }
}

ctl.usb {
    type hw
    card {
        @func getenv
        vars [ ALSA_USB_CARD ]
        default "1"
    }
}

# Simple alias used by scripts: try USB, else internal.
pcm.usb_or_internal {
    type plug
    slave.pcm {
        @func getenv
        vars [ ALSA_USB_PCM ]
        default "internal"
    }
}

# --- system defaults ------------------------------------------------------
pcm.!default {
    type plug
    slave.pcm {
        @func getenv
        vars [ ALSA_DEFAULT_PCM ]
        default "internal"
    }
    hint {
        show on
        description "Default: internal codec (override with ALSA_DEFAULT_PCM=usb)"
    }
}

ctl.!default {
    type hw
    card {
        @func getenv
        vars [ ALSA_INTERNAL_CARD ]
        default "0"
    }
}

pcm.!sysdefault {
    type hw
    card 0
    device 0
}

ctl.!sysdefault {
    type hw
    card 0
}

# --- null fallback (keeps headless/controller mode parse-safe) ------------
pcm.silence {
    type null
}
